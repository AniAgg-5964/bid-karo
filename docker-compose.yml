# Local Qdrant for BidKaro development.
#
# Qdrant holds the retrieval index only. The documents, the requirements, the
# evidence decisions and the eligibility results stay in MongoDB, and the
# original files stay on disk. The volume below is development data and is not
# a backup of anything.
#
#   docker compose up -d qdrant     # start
#   docker compose down             # stop
#   docker compose down -v           # stop and delete the development data
#
# On Windows you can also use scripts\qdrant-dev.ps1, which falls back to the
# standalone Qdrant binary when Docker is not running.

services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    container_name: bidkaro-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
      QDRANT__LOG_LEVEL: ${QDRANT_LOG_LEVEL:-INFO}
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  qdrant_storage:
    name: bidkaro_qdrant_storage
